<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FinLit Expo 2026 – Financial Health Questionnaire</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--navy:#243b73;--orange:#f7941d;--blue:#3a97d4;--yellow:#fcc42a;--ink:#14213d;
--bg:#fff7e8;--bg2:#e6f3fc;--card:#fff;--text:#1c2a4a;--head:#243b73;--muted:#5b6785;--line:#dfe6f2;--sel:#fff0d6;--navy2:#243b73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a36;--bg2:#12264d;--card:#18264a;--text:#f3f6ff;--head:#ffd27a;--muted:#aab6d6;--line:#2c3c66;--sel:#3a2b12;--navy2:#5b7fd6}}
:root[data-theme="dark"]{--bg:#0f1a36;--bg2:#12264d;--card:#18264a;--text:#f3f6ff;--head:#ffd27a;--muted:#aab6d6;--line:#2c3c66;--sel:#3a2b12;--navy2:#5b7fd6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;font:16px/1.5 "Noto Sans Sinhala","Noto Sans Tamil","Iskoola Pota","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{background:linear-gradient(135deg,#243b73 0%,#3a97d4 100%);border-bottom:5px solid var(--orange);padding:14px 16px;text-align:center}
header.top img{display:inline-block;height:112px;width:auto;max-width:100%;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
main{max-width:640px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:1.45rem;margin:6px 0 4px;color:var(--head)}
h2{font-size:1.2rem;line-height:1.4;margin:16px 0;color:var(--head)}
p.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--orange);border-radius:16px;padding:22px;box-shadow:0 6px 18px rgba(36,59,115,.12)}
button{font:inherit;color:inherit;cursor:pointer}
.opt{--c:var(--blue);display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:14px;margin:0 0 12px;min-height:52px;font-weight:500;box-shadow:0 2px 6px rgba(36,59,115,.08);transition:transform .1s,border-color .15s}
.opt:hover{border-color:var(--c);transform:translateY(-1px)}
.opt.on{border-color:var(--orange);border-left-color:var(--orange);background:var(--sel)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;font-size:.9rem}
.opt.on b{background:var(--orange);color:var(--ink)}
.opt[data-k="0"]{--c:var(--navy2)}.opt[data-k="0"] b{color:#fff}
.opt[data-k="1"]{--c:var(--orange)}.opt[data-k="2"]{--c:var(--blue)}.opt[data-k="3"]{--c:var(--yellow)}.opt[data-k="4"]{--c:#e8672a}
.opt[data-lang="en"],.opt[data-cat="u18"]{--c:var(--blue)}
.opt[data-lang="si"],.opt[data-cat="nw"]{--c:var(--orange)}
.opt[data-lang="ta"],.opt[data-cat="w"]{--c:var(--navy2)}
.opt[data-lang],.opt[data-cat]{font-size:1.1rem;font-weight:700;padding:18px 16px;color:var(--head)}
.btn{background:var(--orange);color:var(--ink);border:0;border-radius:14px;padding:13px 24px;font-weight:700;min-height:50px;box-shadow:0 3px 0 #c9740a}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9740a}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--head);border:2px solid var(--navy2);box-shadow:none}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f7941d,#fcc42a);border-radius:99px;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-weight:600;margin:8px 0 0}
.note{background:var(--sel);border-left:6px solid var(--yellow);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0 0 16px}
.res{text-align:center}
.medal{font-size:4rem;line-height:1;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:4px auto 12px;box-shadow:0 0 0 6px rgba(247,148,29,.35)}
.score{font-size:2.3rem;font-weight:800;margin:8px 0;color:var(--orange)}
@media (max-width:480px){header.top img{height:92px}}
</style>
</head>

QUESTIONS.u18.si=[["ඔබට තෑග්ගක් ලෙස රු. 1,000ක් ලැබුණොත්, ඔබ මුලින්ම කරන්නේ කුමක්ද?",[["මිතුරන් සමඟ එකතු වී පාසල් ආපනශාලාවෙන් අයිස්ක්‍රීම් කනවා.",0],["කතා පොතක් මිලදී ගන්නවා.",1],["මුදලින් භාගයක් ඉතිරි කර, ඉතිරි භාගය වියදම් කරනවා.",2],["පසුව අවශ්‍ය වන දෙයක් සඳහා මුදලින් වැඩි කොටසක් ඉතිරි කරනවා.",3]]],["ඔබට ලැබෙන මුදලින් කොටසක් කොපමණ වාරයක් ඉතිරි කරනවාද?",[["මුදල් ලැබෙන සෑම අවස්ථාවකම කොටසක් ඉතිරි කරනවා.",3],["සමහර අවස්ථාවලදී ඉතිරි කරනවා.",1],["ඉතා කලාතුරකින් ඉතිරි කරනවා හෝ කිසිසේත්ම ඉතිරි කරන්නේ නැහැ.",0]]],["පාසලේ කටයුත්තක් සඳහා හදිසියේම සුළු මුදලක් අවශ්‍ය වුණොත්, ඒ සඳහා භාවිත කළ හැකි ඔබේම මුදල් ඔබ ළඟ තිබෙනවාද?",[["එම වියදම සඳහා ප්‍රමාණවත් මුදලක් තිබෙනවා.",3],["යම් මුදලක් තිබෙනවා, නමුත් එය ප්‍රමාණවත් නැහැ.",2],["මා ළඟ මුදල් නැහැ.",0],["මගේ මුදල් කටයුතු මා විසින්ම පාලනය කරන්නේ නැහැ.",0]]],["ඔබ මුදල් ඉතිරි කර තිබෙනවා නම්, උදාහරණයක් ලෙස කැටයක, සාමාන්‍යයෙන් එයින් මුදල් ගන්නේ කුමන කටයුත්තක් සඳහාද?",[["නිතරම කෑම වර්ග මිලදී ගැනීමට.",0],["මා මුදල් ඉතිරි කරමින් සිටි දෙයක් මිලදී ගැනීමට.",2],["පාසල් ව්‍යාපෘතියක් වැනි වැදගත් හෝ අනපේක්ෂිත අවශ්‍යතාවක් සඳහා.",3],["සාමාන්‍යයෙන් මගේ ඉතිරි කිරීම්වලින් මුදල් ගන්නේ නැහැ.",3],["පසුව භාවිත කිරීමට මා මුදල් ඉතිරි කරන්නේ නැහැ.",0]]],["ඔබට අලුත් ක්‍රීඩාවක් මිලදී ගැනීමට දැඩි ආශාවක් තිබෙනවා. නමුත් ඒ සඳහා ප්‍රමාණවත් මුදල් ඔබ ළඟ නැහැ. ඔබ කරන්නේ කුමක්ද?",[["ඒ සඳහා මුදල් ලබාදෙන ලෙස දෙමාපියන්ගෙන් ඉල්ලනවා.",1],["මිතුරෙකුගෙන් මුදල් ණයට ගන්නවා.",1],["ප්‍රමාණවත් මුදලක් ඉතිරි කරගන්නා තෙක් බලා සිටිනවා.",3],["මට එය දැඩි ලෙස අවශ්‍ය නිසා කෙසේ හෝ මිලදී ගන්නවා.",0]]],["ඔබ මේ දිනවල යම් නිශ්චිත දෙයක් සඳහා මුදල් ඉතිරි කරමින් සිටිනවාද?",[["ඔව්, පැහැදිලි ඉලක්කයක් ඇතිව ඉතිරි කරනවා.",3],["ඔව්, නමුත් පැහැදිලි ඉලක්කයක් නැහැ.",2],["මේ දිනවල එවැනි දෙයක් සඳහා ඉතිරි කරන්නේ නැහැ.",0]]],["ඔබට වැදගත් දේවල් සඳහා ප්‍රමාණවත් මුදල් නොමැති වීම ගැන කොපමණ වාරයක් කනස්සල්ලට පත්වෙනවාද?",[["ඉතා කලාතුරකින් හෝ කිසිසේත්ම නැහැ.",3],["සමහර අවස්ථාවලදී.",2],["නිතරම.",1],["පිළිතුරු දීමට කැමති නැහැ.",0]]],["ඔබට පාලනය කිරීමට අවසර ඇති මුදල් සම්බන්ධයෙන් තීරණ ගැනීමට ඔබට කොපමණ විශ්වාසයක් තිබෙනවාද?",[["මට ඉතා හොඳ විශ්වාසයක් තිබෙනවා.",3],["මට යම් විශ්වාසයක් තිබෙනවා.",2],["මට විශ්වාසයක් නැහැ.",0],["මට තවමත් එවැනි අවස්ථාවක් ලැබී නැහැ.",1]]],["ඔබට ලැබෙන මුදලින් කොටසක් කොපමණ වාරයක් ඉතිරි කරනවාද?",[["මුදල් ලැබෙන සෑම අවස්ථාවකම කොටසක් ඉතිරි කරනවා.",3],["සමහර අවස්ථාවලදී ඉතිරි කරනවා.",1],["ඉතා කලාතුරකින් ඉතිරි කරනවා හෝ කිසිසේත්ම ඉතිරි කරන්නේ නැහැ.",0]]],["ඔබ iPhone 17 දුරකථනයක් දිනා ඇති බවට පණිවිඩයක් ලැබෙනවා. නමුත් එය ලබාගැනීමට ලියාපදිංචි ගාස්තුවක් ලෙස රු. 10,000ක් යවන ලෙස ඉල්ලා තිබෙනවා. ඔබ කරන්නේ කුමක්ද?",[["තෑග්ග ලබාගැනීමට තාත්තාගේ බැංකු ගිණුමෙන් හෝ කාඩ්පතෙන් රු. 10,000ක් යවනවා.",0],["මේ ගැන මිතුරෙකුගෙන් හෝ පවුලේ සාමාජිකයෙකුගෙන් විමසනවා.",1],["පණිවිඩය දෙමාපියන්ට පෙන්වා, මුදල් යවන ලෙස ඔවුන්ගෙන් ඉල්ලනවා.",0],["පණිවිඩය නොසලකා හැර මකා දමනවා.",3]]]];
QUESTIONS.nw.si=[["දීමනාවක්, ශිෂ්‍යත්ව මුදලක් (උදාහරණයක් ලෙස මහපොළ) හෝ වෙනත් මූල්‍ය ආධාරයක් ලෙස ඔබට මුදල් ලැබුණු විට, සාමාන්‍යයෙන් ඔබ කරන්නේ කුමක්ද?",[["වහාම වියදම් කරනවා.",0],["කොටසක් වියදම් කර ඉතිරිය තබාගන්නවා.",2],["වියදම් සඳහා අවශ්‍ය මුදල සැලසුම් කර, හැකි නම් කොටසක් ඉතිරි කරනවා.",3],["මුදල් ලැබීම් සහ වියදම් පිළිබඳව විශේෂයෙන් සොයා බලන්නේ නැහැ.",0]]],["ඉදිරි සති දෙක සඳහා ඔබ ළඟ රු. 2,000ක් තිබෙනවා. ඔබ කරන්නේ කුමක්ද?",[["මට අවශ්‍ය විට වියදම් කර, ඉතිරි අවශ්‍යතා සඳහා දෙමාපියන්ගෙන් මුදල් ඉල්ලනවා.",0],["මට කැමති දේවල් මුලින්ම මිලදී ගන්නවා.",1],["එම කාලය පුරා මුදල් ප්‍රමාණවත් වන පරිදි අත්‍යවශ්‍ය වියදම් සැලසුම් කරනවා.",3],["මුදල් අවසන් වුණොත් යම් මුදලක් ණයට ගන්නවා.",0]]],["ඔබ සාමාන්‍යයෙන් සතියකට කරන පෞද්ගලික වියදමට සමාන අනපේක්ෂිත වියදමක් ඇති වුණොත්, වහාම භාවිතයට ගත හැකි ඔබේම මුදලින් එය පියවාගත හැකිද?",[["සම්පූර්ණයෙන්ම පියවාගත හැකියි.",3],["කොටසක් පියවාගත හැකියි.",2],["කිසිසේත්ම පියවාගත නොහැකියි.",0],["නිශ්චිතව කියන්න බැහැ.",0]]],["ඔබට මූල්‍ය සහාය ලැබෙන ප්‍රධාන මාර්ගය තාවකාලිකව නතර වුණොත් (උදාහරණයක් ලෙස මහපොළ දීමනාව මාස කිහිපයක් අත්හිටුවුවහොත්), ඔබ කරන්නේ කුමක්ද?",[["කරන්නේ කුමක්දැයි මට කිසිදු අදහසක් නැහැ.",0],["වහාම මිතුරන්ගෙන් හෝ පවුලේ අයගෙන් මුදල් ඉල්ලනවා.",1],["ඉතිරි කිරීම් හෝ කලින් සැලසුම් කළ වෙනත් මූල්‍ය සහායක් භාවිත කරනවා.",3],["ණයක් හෝ ණය පහසුකමක් මඟින් මුදල් ලබාගන්නවා.",1]]],["ඉදිරි වසර එක සිට තුන දක්වා කාලය සඳහා ඔබ නිශ්චිත මූල්‍ය ඉලක්කයක් හඳුනාගෙන තිබෙනවාද?",[["ඔව්, ඒ සඳහා පැහැදිලි සැලැස්මක් තිබෙනවා.",3],["ඔව්, නමුත් පැහැදිලි සැලැස්මක් නැහැ.",2],["තවමත් නැහැ.",0]]],["ඔබේ අනාගත මූල්‍ය අවශ්‍යතා පිළිබඳව ඔබ කටයුතු කරන ආකාරය වඩාත් හොඳින් විස්තර කරන්නේ කුමන ප්‍රකාශයෙන්ද?",[["ආදායමක් උපයාගැනීමට පටන් ගත් පසු ඒ ගැන සිතනවා.",1],["ඉඳහිට ඒ ගැන සිතනවා.",1],["අනාගත අවශ්‍යතා කිහිපයක් සඳහා සැලසුම් කිරීම ආරම්භ කර තිබෙනවා.",3],["තවමත් ඒ ගැන සිතන්නේ නැහැ.",0]]],["ඉදිරි වසර තුළ ඔබේ පෞද්ගලික මුදල් කටයුතු කළමනාකරණය කරගැනීමට ඔබට කොපමණ විශ්වාසයක් තිබෙනවාද?",[["ඉතා හොඳ විශ්වාසයක් තිබෙනවා.",3],["යම් විශ්වාසයක් තිබෙනවා.",2],["විශ්වාසයක් නැහැ.",0]]],["පසුගිය මාසය තුළ මූල්‍ය ගැටලු නිසා ඔබේ සිතේ සැනසීමට, අධ්‍යයන කටයුතුවලට හෝ දෛනික කටයුතුවලට කොපමණ වාරයක් බලපෑම් ඇතිවුණාද?",[["ඉතා කලාතුරකින් හෝ කිසිසේත්ම නැහැ.",3],["සමහර අවස්ථාවලදී.",2],["නිතරම.",0],["පිළිතුරු දීමට කැමති නැහැ.",0]]],["ඔබේ වියදම් පිළිබඳව කොපමණ වාරයක් සටහන් තබා සොයා බලනවාද?",[["දිනපතා හෝ නිතිපතා.",3],["සමහර අවස්ථාවලදී.",2],["මුදල් හිඟයක් ඇති වූ විට පමණයි.",1],["කිසිවිටෙකත් නැහැ.",0]]],["වහාම භාවිත කිරීමට අවශ්‍ය නොවන රු. 10,000ක් ඔබ ළඟ තිබෙනවා. ඔබ බොහෝ විට කරන්නේ කුමක්ද?",[["මට කැමති දෙයක් සඳහා වියදම් කරනවා.",1],["ඉතිරි කිරීමක් ලෙස සුරක්ෂිතව තබාගන්නවා.",2],["අවදානම් පිළිබඳව සොයා බැලීමකින් තොරව ආයෝජනය කරනවා.",0],["තීරණයක් ගැනීමට පෙර සුදුසු ඉතිරි කිරීමේ හෝ ආයෝජන විකල්ප පිළිබඳව දැනුම ඇති අයෙකුගෙන් විමසනවා.",3]]]];
QUESTIONS.w.si=[["ඔබට මාසික වැටුප ලැබුණු විට, සාමාන්‍යයෙන් මුලින්ම කරන්නේ කුමක්ද?",[["මට අවශ්‍ය දේවල් සඳහා වියදම් කිරීමට පටන් ගන්නවා.",0],["බිල්පත් කිහිපයක් ගෙවා, ඉතිරි මුදල වියදම් කරනවා.",2],["ඉතිරි කිරීම් හෝ අනාගතයේ වැදගත් අවශ්‍යතා සඳහා මුදලක් වෙන් කරනවා.",3],["මා අනුගමනය කරන විශේෂ ක්‍රමයක් නැහැ.",0]]],["ඔබට අලුත් දුරකථනයක් මිලදී ගැනීමට අවශ්‍යයි. එය මිලදී ගැනීමට පෙර ඔබ සලකා බලන්නේ කුමක්ද?",[["මගේ මිතුරන් ළඟත් එම දුරකථනයම තිබෙනවාද යන්න.",0],["මාසික වාරිකය ගෙවීමට මට හැකියාව තිබෙනවාද යන්න.",2],["එය මට සැබවින්ම අවශ්‍යද සහ එය මගේ සමස්ත අයවැයට ගැළපෙනවාද යන්න.",3],["වෙළඳසැලෙන් වට්ටමක් ලබාදෙනවාද යන්න.",0]]],["ඔබට අනපේක්ෂිත ලෙස රු. 50,000ක් ලැබෙනවා. ඔබ බොහෝ විට කරන්නේ කුමක්ද?",[["මා කලක සිට මිලදී ගැනීමට කැමැත්තෙන් සිටි දෙයක් සඳහා වියදම් කරනවා.",0],["දැනට තිබෙන මූල්‍ය බැඳීමක් පියවීමට එය යොදාගන්නවා.",1],["මගේ අවශ්‍යතා සලකා බැලීමෙන් පසු අවම වශයෙන් එයින් කොටසක් ආයෝජනය කරනවා.",3],["මගේ බැංකු ගිණුමේ ඉතිරි කරනවා.",2]]],["ඔබේ පවුලේ ප්‍රධාන ආදායම් මාර්ගය අහිමි වුණොත්, වහාම භාවිතයට ගත හැකි ඉතිරි කිරීම් යොදාගෙන අත්‍යවශ්‍ය වියදම් කොපමණ කාලයක් පියවාගත හැකිද?",[["මාස තුනක් හෝ ඊට වැඩි කාලයක්.",3],["මාස තුනකට අඩු කාලයක්.",2],["භාවිතයට ගත හැකි ඉතිරි කිරීම් නැහැ.",0],["නිශ්චිතව කියන්න බැහැ.",0]]],["ඔබේ දිගුකාලීන මූල්‍ය ඉලක්ක ළඟා කරගැනීම සඳහා ඔබ කොපමණ අඛණ්ඩව ප්‍රගතියක් ලබමින් සිටිනවාද?",[["සැලසුම් කළ පරිදි ප්‍රගතියක් ලබමින් සිටිනවා.",3],["යම් ප්‍රගතියක් ලබමින් සිටිනවා.",2],["දැනට ප්‍රගතියක් ලබන්නේ නැහැ.",0],["නිශ්චිතව කියන්න බැහැ.",0]]],["විශ්‍රාම ගැනීමෙන් පසු ඔබේ ජීවන වියදම් සපයාගන්නේ කෙසේද යන්න පිළිබඳව ඔබ සිතා බලා තිබෙනවාද?",[["ඔව්, මට පැහැදිලි සැලැස්මක් තිබෙන අතර විශ්‍රාම ජීවිතය සඳහා නිතිපතා සූදානම් වෙනවා.",3],["ඔව්, ඒ ගැන සිතා බලා තිබෙනවා. සැලසුම් කිරීම ආරම්භ කළ යුතුයි.",2],["මගේ රජයේ විශ්‍රාම වැටුප ඒ සඳහා ප්‍රමාණවත් වේ යැයි සිතනවා.",1],["නැහැ, ඒ ගැන විශේෂයෙන් සිතා බලා නැහැ.",0]]],["පසුගිය මාසය තුළ මුදල් පිළිබඳ ගැටලු නිසා ඔබට කොපමණ වාරයක් මානසික පීඩනයක් ඇතිවුණාද හෝ ඔබේ දෛනික ජීවිතයට බලපෑම් ඇතිවුණාද?",[["ඉතා කලාතුරකින් හෝ කිසිසේත්ම නැහැ.",3],["සමහර අවස්ථාවලදී.",2],["නිතරම.",0],["පිළිතුරු දීමට කැමති නැහැ.",0]]],["ශල්‍යකර්මයක් වැනි අනපේක්ෂිත වියදමකට මුහුණ දීම සඳහා ඔබ අනුගමනය කරන ක්‍රමය වඩාත් හොඳින් විස්තර කරන්නේ කුමන ප්‍රකාශයෙන්ද?",[["සාමාන්‍යයෙන් මුදල් ණයට ගැනීම මත රඳා පවතිනවා.",0],["හදිසි අවශ්‍යතා සඳහා යම් ඉතිරි මුදලක් තබාගැනීමට උත්සාහ කරනවා.",2],["අනපේක්ෂිත දෙයක් සිදුවූ විට මගේ ක්‍රෙඩිට් කාඩ්පත භාවිත කරනවා.",1],["අනපේක්ෂිත වියදම් ගැන විශේෂයෙන් සිතන්නේ නැහැ.",0],["මට රක්ෂණ ආවරණයක් තිබෙන නිසා එම වියදම පියවාගත හැකි යැයි සිතනවා.",3]]],["ඔබේ ආදායම් සහ වියදම් පිළිබඳව කොපමණ වාරයක් සටහන් තබා සොයා බලනවාද?",[["නිතිපතා.",3],["සමහර අවස්ථාවලදී.",2],["මූල්‍ය ගැටලු ඇති වූ විට පමණයි.",1],["කිසිවිටෙකත් නැහැ.",0]]],["සමාගමක් ඔබට මසකට 10%ක ප්‍රතිලාභයක් ලබාදෙන බව පවසමින්, “අප සමඟ ආයෝජනය කර වසරක් ඇතුළත ධනවතෙකු වන්න” යැයි කියනවා. ඔබ කරන්නේ කුමක්ද?",[["ප්‍රතිලාභය ඉතා ආකර්ෂණීය නිසා වහාම ආයෝජනය කරනවා.",0],["පොරොන්දු වූ ප්‍රතිලාභය ලැබෙනවාදැයි බැලීමට මුලින් සුළු මුදලක් ආයෝජනය කරනවා.",0],["ආයෝජනය කිරීමට පෙර සමාගමේ නීත්‍යානුකූලභාවය පරීක්ෂා කර, අවදානම් අවබෝධ කරගෙන, අදාළ අනුමැතිය හෝ බලපත්‍රය නිසි පරිදි ලබාගෙන තිබේදැයි තහවුරු කරගන්නවා.",3],["ඔවුන් එහි ආයෝජනය කර තිබෙනවාදැයි මිතුරන්ගෙන් හෝ සේවා ස්ථානයේ සගයන්ගෙන් විමසනවා.",1]]]];

 si:{cat:"ඔබේ කාණ්ඩය තෝරන්න",catSub:"ඔබට ගැළපෙන විකල්පය තෝරන්න",back:"ආපසු",next:"ඊළඟ",fin:"අවසන් කරන්න",q:(i,n)=>`ප්‍රශ්නය ${i} / ${n}`,thanks:"ප්‍රශ්නාවලිය සම්පූර්ණ කිරීම ගැන ස්තූතියි.",again:"නැවත ආරම්භ කරන්න",c_u18:"වයස 18ට අඩු",c_nw:"වයස 18ට වැඩි (රැකියාවක නියුතු නොවන)",c_w:"වයස 18ට වැඩි (රැකියාවල නියුතු)",s:["ප්ලැටිනම්","රන්","රිදී","ලෝකඩ"]}
};
const T=k=>(UI[S.lang]||UI.en)[k];
const catName=c=>T("c_"+c[0]);
/* ---------- APP ---------- */
const app=document.getElementById("app");
let S={step:"lang",lang:"en",cat:null,qs:[],i:0,ans:[],fallback:false};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const max=()=>S.qs.reduce((s,q)=>s+Math.max(...q[1].map(o=>o[1])),0);

function render(){
  if(S.step==="lang"){
    app.innerHTML=`<h1>Financial Health Questionnaire</h1><p class="sub">Choose your language</p>`+
      LANGS.map(l=>`<button class="opt" data-lang="${l[0]}"><span>${l[1]}</span></button>`).join("");
    app.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;S.step="cat";render()});
  }else if(S.step==="cat"){
    app.innerHTML=`<h1>${T("cat")}</h1><p class="sub">${T("catSub")}</p>`+
      CATS.map(c=>`<button class="opt" data-cat="${c[0]}"><span>${catName(c)}</span></button>`).join("")+
      `<div class="row"><button class="btn ghost" id="back">${T("back")}</button></div>`;
    app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>start(b.dataset.cat));
    document.getElementById("back").onclick=()=>{S.step="lang";render()};
  }else if(S.step==="quiz"){
    const q=S.qs[S.i],pick=S.ans[S.i],last=S.i===S.qs.length-1;
    app.innerHTML=`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.qs.length}" aria-valuenow="${S.i+1}"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
      <div class="meta"><span>${T("q")(S.i+1,S.qs.length)}</span><span>${catName(CATS.find(c=>c[0]===S.cat))}</span></div>
      <h2>${esc(q[0])}</h2>`+
      (S.fallback&&S.i===0?`<div class="note">Questions in this language are not available yet, so they are shown in English.</div>`:"")+
      q[1].map((o,k)=>`<button class="opt${pick===k?" on":""}" data-k="${k}"><b>${String.fromCharCode(65+k)}</b><span>${esc(o[0])}</span></button>`).join("")+
      `<div class="row"><button class="btn ghost" id="prev">${T("back")}</button><button class="btn" id="next"${pick==null?" disabled":""}>${last?T("fin"):T("next")}</button></div>`;
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.k;render()});
    document.getElementById("prev").onclick=()=>{if(S.i>0){S.i--;render()}else{S.step="cat";render()}};
    document.getElementById("next").onclick=()=>{if(last){S.step="result"}else{S.i++}render()};
    window.scrollTo(0,0);
  }else{
    const total=S.qs.reduce((s,q,i)=>s+q[1][S.ans[i]][1],0);
    const st=STICKERS.find(x=>total>=x[0]);
    app.innerHTML=`<div class="card res"><div class="medal" style="background:${st[3]}">${st[2]}</div><h1>${T("s")[STICKERS.indexOf(st)]}</h1>
      <div class="score">${total} / ${max()}</div><p class="sub">${T("thanks")}</p>
      <button class="btn" id="again">${T("again")}</button></div>`;
    document.getElementById("again").onclick=()=>{S={step:"lang",lang:"en",cat:null,qs:[],i:0,ans:[],fallback:false};render()};
    window.scrollTo(0,0);
  }
}
function start(cat){
  const set=QUESTIONS[cat];
  S.cat=cat;S.fallback=!set[S.lang];S.qs=set[S.lang]||set.en;S.i=0;S.ans=[];S.step="quiz";render();
}
render();
</script>
</body>
</html>
